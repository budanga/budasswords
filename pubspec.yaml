name: budasswords
description: A secure, cross-platform personal password manager.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.0

  # Local DB (Drift / SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Backend (Supabase)
  supabase_flutter: ^2.5.0

  # Encryption
  cryptography: ^2.7.0
  pointycastle: ^3.7.4

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Biometrics (Android)
  local_auth: ^2.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # Utilities
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.9
  mocktail: ^1.0.3
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  windows:
    generate: true
    icon_path: "assets/logo.png"
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
